<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Ironlog</title>
<meta name="description" content="A personal workout tracker: calisthenics, dumbbells, cables and incline walking — all logged on your own device.">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app">
    <div class="view" style="padding-top:80px;text-align:center">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <noscript>
    <div class="view" style="padding-top:60px">
      <h1>JavaScript required</h1>
      <p class="muted" style="margin-top:10px">Ironlog runs entirely in your browser, so it needs JavaScript switched on.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
