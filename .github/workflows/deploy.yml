# Publishes Ironlog to GitHub Pages.
#
# Nothing happens until you switch it on once:
#   repo Settings -> Pages -> Source: "GitHub Actions"
# After that, every push to this branch redeploys the site automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/busy-pascal-cuinwy, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The app is plain static files — no build step, so ship the repo as-is.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
